services:
  postgres:
    container_name: postgres
    image: postgres:17
    restart: always
    environment:
      POSTGRES_DB: gde_oni
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - 5434:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
  seq:
    image: datalust/seq:latest
    container_name: seq
    restart: always
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_NOAUTHENTICATION=true
    ports:
      - 5341:5341
      - 8081:80
  minio:
    container_name: minio
    image: minio/minio
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - minio_data:/data
    command: server --console-address ":9001" /data
    restart: always
    # Production overrides — раскомментировать после настройки nginx и DNS
    # (см. backend/docs/deploy.md). MINIO_SERVER_URL заставляет MinIO писать
    # публичный домен в presigned URL вместо внутреннего minio:9000.
    # environment:
    #   MINIO_ROOT_USER: ${MINIO_ROOT_USER}
    #   MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    #   MINIO_SERVER_URL: https://files.gdeoni.example.com
    #   MINIO_BROWSER_REDIRECT_URL: https://minio-console.gdeoni.example.com
volumes:
  postgres-data:
  minio_data: