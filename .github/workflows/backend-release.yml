# D20.2. Backend release — собирает Docker-образ для GHCR на тегах
# вида `backend-v1.2.3`. Триггерится только пушем тега, чтобы не
# писать в registry на каждый коммит в main.
#
# Авторизация в GHCR — через стандартный GITHUB_TOKEN с правами
# `packages: write` (см. permissions ниже). Никаких extra-секретов
# заводить не нужно.
#
# Pre-deploy шага (SSH на сервер + docker compose pull) сейчас нет —
# подключим когда определимся с хостингом (см. H5 в PlanFull.txt).

name: backend-release

on:
  push:
    tags:
      - 'backend-v*'

permissions:
  contents: read
  packages: write

jobs:
  publish-docker:
    name: build + push Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        # backend-v1.2.3 → 1.2.3.
        run: |
          version="${GITHUB_REF_NAME#backend-v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Building backend version: ${version}"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # docker/metadata-action генерирует список тегов из условий ниже —
      # обычно это `ghcr.io/owner/repo:1.2.3` + `:1.2` + `:latest`.
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/gdeoni-api
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # Build context — корень репозитория, потому что Dockerfile
          # копирует все src/*.csproj через относительные пути.
          context: backend
          file: backend/src/GdeOni.API/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
