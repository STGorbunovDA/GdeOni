<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- PWA: «установить сайт как приложение» на главный экран телефона.
         Android (Chrome) сам предложит установку; iPhone (Safari) —
         «Поделиться → На экран „Домой"». Иконка/имя берутся отсюда. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1977CC" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ГдеОни" />

    <!-- F27. SEO / social preview + русские варианты написания бренда
         (ГдеОни / Где Они / Где они / где они / gdeoni), чтобы сайт находило
         по этим запросам в Яндексе и Google. -->
    <title>ГдеОни (Где Они) — поиск могил и мест захоронений по GPS</title>
    <meta
      name="description"
      content="«Где Они» (ГдеОни) — каталог мест захоронений с GPS-координатами: быстро находите могилы близких, делитесь местом с родственниками, храните семейную память."
    />
    <meta
      name="keywords"
      content="ГдеОни, Где Они, Где они, где они, GdeOni, gdeoni, поиск могил, найти могилу, места захоронений, каталог захоронений, GPS координаты могилы, поиск умерших, кладбище, память о близких"
    />
    <link rel="canonical" href="https://gdeoni.ru/" />

    <meta property="og:site_name" content="ГдеОни (Где Они)" />
    <meta property="og:title" content="ГдеОни (Где Они) — поиск могил" />
    <meta
      property="og:description"
      content="Каталог мест захоронений с GPS-координатами. Найдите могилу близкого и поделитесь местом с родными."
    />
    <meta property="og:image" content="https://gdeoni.ru/apple-touch-icon.png" />
    <meta property="og:url" content="https://gdeoni.ru/" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ru_RU" />

    <!-- Структурированные данные: имя бренда + варианты написания
         (alternateName) — сигнал Яндексу/Google, что «Где Они», «где они»
         и «gdeoni» это один и тот же сайт. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "url": "https://gdeoni.ru/",
        "name": "ГдеОни",
        "alternateName": ["Где Они", "Где они", "где они", "GdeOni", "gdeoni"],
        "inLanguage": "ru"
      }
    </script>

    <!-- Шрифты подключены локально (src/assets/fonts/fonts.css, импорт
         в main.tsx). Google Fonts НЕ используем: сайт должен работать
         на сервере без внешнего интернета и без утечки IP посетителей
         на сторонний CDN. -->

    <!-- F37. Ставим схему до первой отрисовки. Без этого React успевает
         показать светлый фон, и тёмная тема моргает белым при каждой
         загрузке. Ключ и значения — те же, что у Mantine
         localStorageColorSchemeManager в main.tsx. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('gdeoni-color-scheme') || 'auto';
          var dark =
            stored === 'dark' ||
            (stored === 'auto' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute(
            'data-mantine-color-scheme',
            dark ? 'dark' : 'light',
          );
        } catch (e) {
          /* приватный режим без localStorage — остаёмся на светлой */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
