<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- PWA: «установить сайт как приложение» на главный экран телефона.
         Android (Chrome) сам предложит установку; iPhone (Safari) —
         «Поделиться → На экран „Домой"». Иконка/имя берутся отсюда. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1977CC" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ГдеОни" />

    <!-- F27. SEO / social preview. Минимум для превью ссылки в
         мессенджерах и поисковой выдачи. -->
    <title>ГдеОни — сайт поиска умерших</title>
    <meta
      name="description"
      content="Каталог мест захоронений с GPS-координатами: быстро находите могилы близких, делитесь местом с родственниками, храните семейную память."
    />

    <meta property="og:title" content="ГдеОни" />
    <meta
      property="og:description"
      content="Каталог мест захоронений с GPS-координатами."
    />
    <meta property="og:image" content="/favicon.svg" />
    <meta property="og:type" content="website" />

    <!-- Шрифты подключены локально (src/assets/fonts/fonts.css, импорт
         в main.tsx). Google Fonts НЕ используем: сайт должен работать
         на сервере без внешнего интернета и без утечки IP посетителей
         на сторонний CDN. -->

    <!-- F37. Ставим схему до первой отрисовки. Без этого React успевает
         показать светлый фон, и тёмная тема моргает белым при каждой
         загрузке. Ключ и значения — те же, что у Mantine
         localStorageColorSchemeManager в main.tsx. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('gdeoni-color-scheme') || 'auto';
          var dark =
            stored === 'dark' ||
            (stored === 'auto' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute(
            'data-mantine-color-scheme',
            dark ? 'dark' : 'light',
          );
        } catch (e) {
          /* приватный режим без localStorage — остаёмся на светлой */
        }
      })();
    </script>

    <!-- Загрузочный сплэш: белый фон, синий контур облака и белый шарик,
         бегущий по контуру (SVG animateMotion). Стили заинлайнены, чтобы
         экран отрисовался мгновенно — до загрузки основного бандла. Снимает
         его src/components/AppSplash.tsx, когда приложение готово. -->
    <style>
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 26px;
        background: #ffffff;
        transition: opacity 0.4s ease;
      }
      #app-splash svg {
        width: 148px;
        height: 148px;
        overflow: visible;
      }
      #app-splash .cl-path {
        fill: none;
        stroke: #1977cc;
        stroke-width: 1.4;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      #app-splash .cl-dot {
        fill: #ffffff;
        stroke: #1977cc;
        stroke-width: 0.5;
        filter: drop-shadow(0 0 1.4px rgba(25, 119, 204, 0.75));
      }
      #app-splash .cl-label {
        font-family: "Montserrat", "Roboto", system-ui, -apple-system,
          "Segoe UI", sans-serif;
        font-weight: 800;
        font-size: 22px;
        letter-spacing: 0.6px;
        color: #1977cc;
      }
    </style>
  </head>
  <body>
    <div id="app-splash" role="status" aria-label="Загрузка">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path
          id="cl-cloud"
          class="cl-path"
          d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"
        />
        <circle class="cl-dot" r="1.2">
          <animateMotion dur="2.4s" repeatCount="indefinite">
            <mpath href="#cl-cloud" />
          </animateMotion>
        </circle>
      </svg>
      <div class="cl-label">Где Они</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
